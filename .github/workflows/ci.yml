name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # A throwaway database reachable only from this job: no password to
        # store or leak, so connections are trusted.
        env:
          POSTGRES_USER: vetify
          POSTGRES_DB: vetify_security_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetify -d vetify_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Actions are pinned to a commit SHA (the tag in the comment): a moved
      # or compromised tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Turborepo compares against the previous commit to know which
          # packages changed; a shallow clone cannot.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @vetify/api exec prisma generate

      - name: Apply migrations to the disposable security database
        run: pnpm --filter @vetify/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://vetify@localhost:5432/vetify_security_ci

      - name: Verify
        # Sequential so the web typecheck never races with its own build.
        run: pnpm turbo run lint typecheck test build --concurrency=1
        env:
          # The build does not touch the database; a well-formed URL is enough.
          DATABASE_URL: postgresql://ci@localhost:5432/vetify
          SECURITY_TEST_DATABASE_URL: postgresql://vetify@localhost:5432/vetify_security_ci

      - name: Generate API and web coverage
        run: |
          pnpm --filter @vetify/api test:cov
          pnpm --filter @vetify/web test:cov
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://vetify@localhost:5432/vetify_security_ci

      - name: SonarQube Cloud analysis and quality gate
        if: >-
          vars.SONAR_ENABLED == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

      - name: API adversarial end-to-end tests
        run: pnpm --filter @vetify/api test:e2e
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://vetify@localhost:5432/vetify_security_ci

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

  snyk:
    name: Snyk (${{ matrix.scan }})
    timeout-minutes: 20
    if: >-
      vars.SNYK_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scan: [dependencies, code, container]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        with:
          snyk-version: v1.1308.2
      - name: Scan workspace dependencies
        if: matrix.scan == 'dependencies'
        run: snyk test --all-projects --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Scan source code
        if: matrix.scan == 'code'
        run: snyk code test --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Build API runtime image
        if: matrix.scan == 'container'
        run: docker build --tag vetify-api:ci --file apps/api/Dockerfile .
      - name: Scan API runtime image
        if: matrix.scan == 'container'
        run: snyk container test vetify-api:ci --file=apps/api/Dockerfile --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
