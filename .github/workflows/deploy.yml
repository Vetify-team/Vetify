name: Migrate production database

# Vercel (web) and Render (api) deploy themselves from their GitHub
# integrations. This workflow only applies Prisma migrations to the production
# database on every push to main. Render is set to auto-deploy "after CI checks
# pass", so it waits for this check and the API never runs ahead of its schema.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a migration halfway; queue the next one instead.
concurrency:
  group: migrate-production
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile --filter @vetify/api...

      # The direct (non-pooled) Neon URL: migrations take an advisory lock,
      # which the pooled endpoint does not keep across statements.
      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The production environment has no DATABASE_URL_DIRECT secret."
            exit 1
          fi
          pnpm --filter @vetify/api exec prisma migrate deploy
