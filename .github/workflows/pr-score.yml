name: PR score

# A required check: 100 points from SonarQube Cloud's ratings on new code and
# the coverage of the lines the PR changes (scripts/pr-score/). Below 80 the
# check fails and blocks the merge; a human approval is required on top. The
# score is only given once every other required check passed on the commit.

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-score-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  score:
    name: PR score
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        # A throwaway database reachable only from this job: no password.
        env:
          POSTGRES_USER: vetify
          POSTGRES_DB: vetify_security_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetify -d vetify_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The diff against the base needs the history of both sides.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Test the score calculation
        run: node --test scripts/pr-score/score.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the API (Prisma client, shared types, migrations)
        run: |
          pnpm --filter @vetify/api exec prisma generate
          pnpm --filter @vetify/types build
          pnpm --filter @vetify/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://vetify@localhost:5432/vetify_security_ci

      - name: Run tests with coverage
        # Every package with Vitest's coverage provider writes coverage/lcov.info.
        run: |
          for dir in apps/* packages/*; do
            [ -f "$dir/package.json" ] || continue
            if node -e "const p=require('./$dir/package.json'); const d={...p.dependencies,...p.devDependencies}; process.exit(d.vitest && d['@vitest/coverage-v8'] ? 0 : 1)"; then
              echo "::group::Coverage for $dir"
              (cd "$dir" && pnpm exec vitest run --coverage --coverage.reporter=lcov --coverage.include='src/**')
              echo "::endgroup::"
            fi
          done
        env:
          DATABASE_URL: postgresql://vetify@localhost:5432/vetify_security_ci
          SECURITY_TEST_DATABASE_URL: postgresql://vetify@localhost:5432/vetify_security_ci

      - name: Compute and publish the score
        run: node scripts/pr-score/index.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Every other required check of the main/dev ruleset; keep in sync.
          REQUIRED_CHECKS: |
            Branch policy
            Lint, typecheck, test and build
            Snyk (dependencies)
            Snyk (code)
            Snyk (container)
            SonarCloud Code Analysis
            security/snyk (aleleonmarin)
