# Configuration for SonarQube Cloud Automatic Analysis, the analysis method this
# project uses. CI does not run its own scanner: Sonar rejects CI analysis while
# Automatic Analysis is enabled.
#
# Applied Prisma migrations are immutable (their checksum is recorded), so a
# finding there could never be fixed in place; generated and built code is not
# ours to fix either.
sonar.exclusions=**/src/generated/**,apps/api/prisma/migrations/**,**/.next/**,**/dist/**,**/node_modules/**,apps/docs/static/openapi.json
