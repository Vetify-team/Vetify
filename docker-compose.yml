# Local PostgreSQL + API, to develop without a hosted database.
#   docker compose up -d db     database only
#   docker compose up           database and API image
#
# Every credential here is for local development only. Production secrets
# live in the hosting provider, never in this file.

services:
  db:
    image: postgres:16-alpine
    container_name: vetify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetify
      POSTGRES_PASSWORD: vetify
      POSTGRES_DB: vetify
    ports:
      # Bound to localhost: the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # The volume keeps its original name so existing local data survives.
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetify -d vetify"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vetify-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vetify:vetify@db:5432/vetify
      PORT: 3001
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000
      API_DOCS_ENABLED: "true"
      JWT_ACCESS_SECRET: local-only-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: local-only-refresh-secret-at-least-32-chars
      LINK_CODE_SECRET: local-only-link-code-secret-at-least-32-chars
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  datos-postgres:
