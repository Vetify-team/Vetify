packages:
  - "apps/*"
  - "packages/*"

# argon2 es un módulo nativo: necesita correr su script de instalación.
onlyBuiltDependencies:
  - argon2
  - "@prisma/client"
  - prisma
  - "@prisma/engines"
  - esbuild
  - unrs-resolver
  - core-js
  - "@tailwindcss/oxide"
  - sharp

# Patched versions of transitive dependencies flagged by Snyk. Remove an entry
# once every package that pulls it in requires the fixed version itself.
overrides:
  qs: ^6.16.1
  mysql2: ^3.23.1
  fast-uri@3: ^3.1.9
  dompurify: ^3.4.16
  sharp: ^0.35.5
  deepmerge-ts: ^8.0.0
  zod: ^4.6.6
