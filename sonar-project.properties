# Project key and organization are supplied by CI repository variables.
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=apps/api/src,apps/web/src,packages/types/src
sonar.tests=apps/api/src,apps/api/test,apps/web/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e.mjs
sonar.exclusions=**/src/generated/**,**/.next/**,**/dist/**,**/node_modules/**,apps/docs/static/openapi.json
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
